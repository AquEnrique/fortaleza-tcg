<button
  type="button"
  class="group relative flex flex-col overflow-hidden rounded-lg border bg-card text-left transition-colors hover:border-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background"
  [attr.aria-label]="card().name + ', ' + card().points + ' puntos. Ver detalle.'"
  (click)="open()"
>
  <div class="relative aspect-[268/391] w-full overflow-hidden bg-muted">
    <img
      [src]="imageUrl()"
      [alt]="card().name"
      loading="lazy"
      decoding="async"
      width="268"
      height="391"
      class="h-full w-full object-cover transition-transform duration-200 group-hover:scale-105"
    />
    <span class="absolute bottom-1 right-1 rounded-md border px-1.5 py-0.5 text-[11px] font-bold leading-none shadow font-score" [class]="pointsClass()">
      {{ card().points }}
    </span>
    @if (card().banTcg) {
      <span class="absolute left-1 top-1 h-2 w-2 rounded-full bg-destructive shadow" aria-hidden="true"></span>
    }
  </div>
  <p class="line-clamp-2 p-1.5 text-center text-[11px] font-medium leading-tight text-foreground sm:text-xs">
    {{ card().name }}
  </p>
</button>
